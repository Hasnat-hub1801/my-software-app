  </head><body class="bg-surface font-body-lg text-on-surface flex flex-col min-h-screen"><header class="fixed top-0 inset-x-0 z-50 bg-surface/80 backdrop-blur-xl pt-safe"><div class="h-16 px-margin flex items-center justify-between"><h1 class="font-headline-lg text-headline-lg text-on-surface tracking-tight">Calculator</h1><div class="flex items-center gap-space-sm"><div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center"><span class="material-symbols-outlined text-on-primary text-[18px]">person</span></div></div></div></header><main class="flex flex-col relative w-full px-margin pt-16 pb-20 bg-surface flex-1"><div class="flex flex-col w-full pb-6">
<!-- Calculator Display Screen -->
<div class="flex flex-col bg-surface-container rounded-xl p-space-lg mb-space-lg shadow-sm justify-end min-h-[160px] relative overflow-hidden">
<div class="absolute top-3 left-4 flex items-center gap-2">
<span class="w-2 h-2 rounded-full bg-primary-container animate-pulse"></span>
<span class="font-label-lg text-xs text-on-surface-variant tracking-wider">STANDARD</span>
</div>
<div class="font-label-lg text-sm text-on-surface-variant text-right tracking-wider mb-space-xs h-6 overflow-x-auto whitespace-nowrap" id="history-display"></div>
<div class="font-display-xl text-headline-lg text-on-surface text-right tracking-tight overflow-x-auto whitespace-nowrap" id="main-display">0</div>
</div>
<!-- Keypad Grid -->
<div class="grid grid-cols-4 gap-gutter w-full">
<!-- Row 1 -->
<button class="flex items-center justify-center h-16 rounded-lg bg-surface-container-high text-on-surface hover:bg-surface-bright active:scale-95 transition-all font-label-lg text-lg" onclick="clearAll()">C</button>
<button class="flex items-center justify-center h-16 rounded-lg bg-surface-container-high text-on-surface hover:bg-surface-bright active:scale-95 transition-all font-label-lg text-lg" onclick="appendOperator('%')">%</button>
<button class="flex items-center justify-center h-16 rounded-lg bg-surface-container-high text-on-surface hover:bg-surface-bright active:scale-95 transition-all font-label-lg text-lg" onclick="toggleSign()">+/-</button>
<button class="flex items-center justify-center h-16 rounded-lg bg-primary-container text-on-primary-container hover:opacity-90 active:scale-95 transition-all font-label-lg text-lg" onclick="appendOperator('/')">÷</button>
<!-- Row 2 -->
<button class="flex items-center justify-center h-16 rounded-lg bg-surface-container-low text-on-surface hover:bg-surface-container-high active:scale-95 transition-all font-label-lg text-lg" onclick="appendNumber('7')">7</button>
<button class="flex items-center justify-center h-16 rounded-lg bg-surface-container-low text-on-surface hover:bg-surface-container-high active:scale-95 transition-all font-label-lg text-lg" onclick="appendNumber('8')">8</button>
<button class="flex items-center justify-center h-16 rounded-lg bg-surface-container-low text-on-surface hover:bg-surface-container-high active:scale-95 transition-all font-label-lg text-lg" onclick="appendNumber('9')">9</button>
<button class="flex items-center justify-center h-16 rounded-lg bg-primary-container text-on-primary-container hover:opacity-90 active:scale-95 transition-all font-label-lg text-lg" onclick="appendOperator('*')">×</button>
<!-- Row 3 -->
<button class="flex items-center justify-center h-16 rounded-lg bg-surface-container-low text-on-surface hover:bg-surface-container-high active:scale-95 transition-all font-label-lg text-lg" onclick="appendNumber('4')">4</button>
<button class="flex items-center justify-center h-16 rounded-lg bg-surface-container-low text-on-surface hover:bg-surface-container-high active:scale-95 transition-all font-label-lg text-lg" onclick="appendNumber('5')">5</button>
<button class="flex items-center justify-center h-16 rounded-lg bg-surface-container-low text-on-surface hover:bg-surface-container-high active:scale-95 transition-all font-label-lg text-lg" onclick="appendNumber('6')">6</button>
<button class="flex items-center justify-center h-16 rounded-lg bg-primary-container text-on-primary-container hover:opacity-90 active:scale-95 transition-all font-label-lg text-lg" onclick="appendOperator('-')">-</button>
<!-- Row 4 -->
<button class="flex items-center justify-center h-16 rounded-lg bg-surface-container-low text-on-surface hover:bg-surface-container-high active:scale-95 transition-all font-label-lg text-lg" onclick="appendNumber('1')">1</button>
<button class="flex items-center justify-center h-16 rounded-lg bg-surface-container-low text-on-surface hover:bg-surface-container-high active:scale-95 transition-all font-label-lg text-lg" onclick="appendNumber('2')">2</button>
<button class="flex items-center justify-center h-16 rounded-lg bg-surface-container-low text-on-surface hover:bg-surface-container-high active:scale-95 transition-all font-label-lg text-lg" onclick="appendNumber('3')">3</button>
<button class="flex items-center justify-center h-16 rounded-lg bg-primary-container text-on-primary-container hover:opacity-90 active:scale-95 transition-all font-label-lg text-lg" onclick="appendOperator('+')">+</button>
<!-- Row 5 -->
<button class="col-span-2 flex items-center justify-center h-16 rounded-lg bg-surface-container-low text-on-surface hover:bg-surface-container-high active:scale-95 transition-all font-label-lg text-lg" onclick="appendNumber('0')">0</button>
<button class="flex items-center justify-center h-16 rounded-lg bg-surface-container-low text-on-surface hover:bg-surface-container-high active:scale-95 transition-all font-label-lg text-lg" onclick="appendDecimal()">.</button>
<button class="flex items-center justify-center h-16 rounded-lg bg-primary text-on-primary hover:opacity-90 active:scale-95 transition-all font-label-lg text-lg" onclick="calculate()">=</button>
</div>
<script>
    let currentInput = '0';
    let historyInput = '';
    let resetScreen = false;

    const mainDisplay = document.getElementById('main-display');
    const historyDisplay = document.getElementById('history-display');

    function updateDisplay() {
      mainDisplay.textContent = currentInput;
      historyDisplay.textContent = historyInput;
    }

    function appendNumber(num) {
      if (currentInput === '0' || resetScreen) {
        currentInput = num;
        resetScreen = false;
      } else {
        currentInput += num;
      }
      updateDisplay();
    }

    function appendDecimal() {
      if (resetScreen) {
        currentInput = '0.';
        resetScreen = false;
        updateDisplay();
        return;
      }
      if (!currentInput.includes('.')) {
        currentInput += '.';
        updateDisplay();
      }
    }

    function appendOperator(op) {
      historyInput += currentInput + ' ' + op + ' ';
      currentInput = '0';
      resetScreen = false;
      updateDisplay();
    }

    function clearAll() {
      currentInput = '0';
      historyInput = '';
      resetScreen = false;
      updateDisplay();
    }

    function toggleSign() {
      if (currentInput !== '0') {
        if (currentInput.startsWith('-')) {
          currentInput = currentInput.substring(1);
        } else {
          currentInput = '-' + currentInput;
        }
        updateDisplay();
      }
    }

    function calculate() {
      try {
        let fullExpression = historyInput + currentInput;
        // Replace visual operators with JS operators
        let sanitized = fullExpression.replace(/×/g, '*').replace(/÷/g, '/');
        let result = eval(sanitized);
        
        // Handle floating point weirdness
        result = parseFloat(result.toFixed(8));

        historyInput = fullExpression + ' =';
        currentInput = result.toString();
        resetScreen = true;
        updateDisplay();
      } catch (error) {
        currentInput = 'Error';
        resetScreen = true;
        updateDisplay();
      }
    }
  </script>
</div></main><nav class="fixed bottom-0 inset-x-0 z-50 pb-safe bg-surface/90 backdrop-blur-xl" data-active-classes="bg-primary-container text-on-primary-container font-medium"><div class="flex justify-around items-center h-20 px-gutter"><a aria-current="page" class="flex flex-col items-center justify-center gap-space-xs w-16 h-16 transition-all rounded-xl bg-primary-container text-on-primary-container font-medium" data-path="calculator" href="#"><span class="material-symbols-outlined">calculate</span><span class="font-label-lg text-xs">Calc</span></a><a class="flex flex-col items-center justify-center gap-space-xs w-16 h-16 text-on-surface-variant hover:text-on-surface transition-all rounded-xl" data-path="history" href="#"><span class="material-symbols-outlined">history</span><span class="font-label-lg text-xs">History</span></a><a class="flex flex-col items-center justify-center gap-space-xs w-16 h-16 text-on-surface-variant hover:text-on-surface transition-all rounded-xl" data-path="settings" href="#"><span class="material-symbols-outlined">settings</span><span class="font-label-lg text-xs">Settings</span></a></div></nav></body></html>
